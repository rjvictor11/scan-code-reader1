<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<script src="js/theme.js"></script>
<script>
// Casual password gate, not real security (same spirit as harness-toolkit's
// gate.js) -- keeps this out of reach of the "bunch of people" who use
// index.html, without needing real user accounts. Change the password by
// editing ADMIN_PASSWORD below and pushing. Runs before <body> renders so
// there's no flash of the management UI before the check.
const ADMIN_PASSWORD = "scan-admin-4471";
const GATE_KEY = "scan_reader_projects_unlocked";
if (localStorage.getItem(GATE_KEY) !== "ok") {
 document.documentElement.style.visibility = "hidden";
}
function showPasswordGate() {
 const overlay = document.createElement("div");
 overlay.style.cssText = "position:fixed;inset:0;background:#1f3350;display:flex;align-items:center;justify-content:center;z-index:9999;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;";
 overlay.innerHTML =
  '<div style="background:#fff;border-radius:10px;padding:28px 32px;width:260px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.3)">' +
  '<div style="font-weight:600;font-size:15px;margin-bottom:14px;color:#1a1f26">Manage Projects</div>' +
  '<input type="password" id="gate-password" placeholder="Password" autocomplete="current-password" style="width:100%;padding:9px 11px;border:1px solid #dfe4ea;border-radius:7px;font-size:14px;box-sizing:border-box">' +
  '<div id="gate-err" style="color:#c00000;font-size:12px;margin-top:8px;min-height:16px"></div>' +
  '<button id="gate-go" style="margin-top:8px;width:100%;padding:9px;border:none;border-radius:7px;background:#1f3350;color:#fff;font-size:14px;cursor:pointer">Enter</button>' +
  "</div>";
 document.body.appendChild(overlay);
 document.documentElement.style.visibility = "visible";

 const input = document.getElementById("gate-password");
 const err = document.getElementById("gate-err");
 function tryUnlock() {
  if (input.value === ADMIN_PASSWORD) {
   localStorage.setItem(GATE_KEY, "ok");
   overlay.remove();
  } else {
   err.textContent = "Wrong password.";
   input.value = "";
  }
 }
 document.getElementById("gate-go").addEventListener("click", tryUnlock);
 input.addEventListener("keydown", e => { if (e.key === "Enter") tryUnlock(); });
 input.focus();
}
if (localStorage.getItem(GATE_KEY) !== "ok") {
 document.addEventListener("DOMContentLoaded", showPasswordGate);
}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Projects</title>
<style>
 :root{--navy:#1f3350;--navy2:#2c4a70;--ink:#1a1f26;--muted:#6b7684;--line:#dfe4ea;--line2:#eef1f5;
  --bg:#f7f8fa;--panel:#fff;--surface:#fff;--steel:#e8eef6;--red:#c00000;--redbg:#fbeaea;
  --green:#1a7a3c;--greenbg:#e8f5ec;--focus:#3a6ea5;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
 :root[data-theme="dark"]{--ink:#e7ecf2;--muted:#93a0b3;--line:#2e3a4a;--line2:#212b38;
  --bg:#0e161f;--panel:#182330;--surface:#1f2c3c;--steel:#22324a;--red:#ff8a8a;--redbg:#3a2222;
  --green:#4ade80;--greenbg:#16321f;--focus:#5b9bd5;}
 .theme-switch{display:inline-flex;align-items:center;cursor:pointer}
 .theme-switch input{position:absolute;opacity:0;width:1px;height:1px}
 .theme-switch-track{width:34px;height:19px;background:rgba(255,255,255,.25);border-radius:20px;position:relative;transition:background .15s;flex-shrink:0}
 .theme-switch-thumb{position:absolute;top:2px;left:2px;width:15px;height:15px;background:#fff;border-radius:50%;transition:transform .15s}
 .theme-switch input:checked+.theme-switch-track{background:rgba(255,255,255,.55)}
 .theme-switch input:checked+.theme-switch-track .theme-switch-thumb{transform:translateX(15px)}
 *{box-sizing:border-box} [hidden]{display:none!important}
 body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
 .wrap{max-width:480px;margin:0 auto;padding:0 16px 60px}
 header{background:var(--navy);color:#fff;margin:0 0 16px;padding:18px 16px}
 header a{color:#b9c6d8;font-size:12px;text-decoration:none}
 header .head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
 header h1{margin:6px 0 0;font-size:17px;font-weight:600}
 header .sub{color:#b9c6d8;font-size:12px;display:block;margin-top:4px}
 .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
 .card h2{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
 label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:4px;font-weight:600}
 input[type=text]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;margin-bottom:10px;background:var(--surface);color:var(--ink);text-transform:uppercase}
 input:focus{outline:2px solid var(--focus);outline-offset:-1px;border-color:var(--focus)}
 button{padding:10px 14px;border:none;border-radius:8px;background:var(--navy);color:#fff;font-size:14px;cursor:pointer}
 button:hover{background:var(--navy2)} button:disabled{opacity:.6;cursor:default}
 button.ghost{background:none;color:var(--focus);padding:7px 12px;font-size:13px;border:1px solid var(--line)}
 .msg{font-size:12.5px;margin-top:8px;min-height:16px}
 .msg.err{color:var(--red);background:var(--redbg);padding:8px 10px;border-radius:8px}
 .msg.ok{color:var(--green)}
 .project-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
 .project-row:last-child{border-bottom:none}
 .project-row .code{font-weight:600;flex:1;font-size:15px;letter-spacing:.3px}
 .badge{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.4px;padding:3px 8px;border-radius:10px}
 .badge-active{background:var(--greenbg);color:var(--green)}
 .badge-inactive{background:var(--redbg);color:var(--red)}
 .empty{color:var(--muted);font-size:13px;text-align:center;padding:10px 0}
 .checkbox-row{display:flex;align-items:center;gap:8px;margin:10px 0}
 .checkbox-row input{width:auto;margin:0}
 .checkbox-row label{margin:0;text-transform:none;letter-spacing:0;font-weight:400;font-size:13.5px;color:var(--ink)}
</style></head><body>
<header>
 <div class="head-row">
  <div>
   <a href="index.html">&larr; Back to scanner</a>
   <h1>Manage Projects</h1>
   <span class="sub">Activate, deactivate, or add a project from here &mdash; no Supabase dashboard needed.</span>
  </div>
  <label class="theme-switch" title="Toggle dark mode">
   <input type="checkbox" id="theme-toggle" aria-label="Toggle dark mode">
   <span class="theme-switch-track"><span class="theme-switch-thumb"></span></span>
  </label>
 </div>
</header>
<div class="wrap">

 <div class="card">
  <h2>Projects</h2>
  <div id="project-list"></div>
 </div>

 <div class="card">
  <h2>Add a new project</h2>
  <label>Code</label>
  <input type="text" id="new-code" placeholder="e.g. XY" maxlength="20">
  <div class="checkbox-row">
   <input type="checkbox" id="new-active">
   <label for="new-active">Make it active immediately (shows in the scanner right away)</label>
  </div>
  <button id="btn-add-project">Add project</button>
  <div class="msg" id="add-msg"></div>
 </div>

</div>
<script>
const $ = id => document.getElementById(id);
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

async function loadList() {
 const { data, error } = await sbClient.from("projects").select("code, active").order("code");
 if (error) { $("project-list").innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
 if (!data.length) { $("project-list").innerHTML = '<div class="empty">No projects yet.</div>'; return; }
 $("project-list").innerHTML = data.map(p => `
  <div class="project-row">
   <span class="code">${esc(p.code)}</span>
   <span class="badge ${p.active ? "badge-active" : "badge-inactive"}">${p.active ? "Active" : "Inactive"}</span>
   <button class="ghost" data-toggle="${esc(p.code)}" data-current="${p.active}">${p.active ? "Deactivate" : "Activate"}</button>
  </div>`).join("");
}

$("project-list").addEventListener("click", async e => {
 const btn = e.target.closest("button[data-toggle]");
 if (!btn) return;
 const code = btn.dataset.toggle;
 const newActive = btn.dataset.current !== "true";
 btn.disabled = true;
 const { error } = await sbClient.from("projects").update({ active: newActive }).eq("code", code);
 btn.disabled = false;
 if (error) { alert("Couldn't update " + code + ": " + error.message); return; }
 loadList();
});

$("btn-add-project").addEventListener("click", async () => {
 const code = $("new-code").value.trim().toUpperCase();
 if (!code) return;
 const msg = $("add-msg");
 msg.className = "msg";
 msg.textContent = "Adding…";
 const { error } = await sbClient.from("projects").insert({ code, active: $("new-active").checked });
 if (error) {
  msg.className = "msg err";
  msg.textContent = error.message;
  return;
 }
 msg.className = "msg ok";
 msg.textContent = `Added ${code}.`;
 $("new-code").value = "";
 $("new-active").checked = false;
 loadList();
});

$("new-code").addEventListener("keydown", e => { if (e.key === "Enter") $("btn-add-project").click(); });

loadList();
</script>
</body></html>
